[tool.poetry]
name = "loading-programs"
version = "1.0.0"
description = "Matrix data loading and analysis exercise"
authors = ["eseragio <eseragio@student.42porto.com>"]

[tool.poetry.dependencies]
python = "^3.10"
pandas = ">=2.0.0"
numpy = ">=1.24.0"
matplotlib = ">=3.7.0"
requests = {version = ">=2.31.0", optional = true }

[tool.poetry.extras]
network = ["requests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"